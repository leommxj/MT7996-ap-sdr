# WAN1/eth1 is the direct laptop/export link; it keeps a static address.
# The other external ports are DHCP clients on the management LAN.
EXPORT_IF=eth1
EXPORT_ADDRESS=10.77.0.1/24
EXPORT_MTU=9216

DHCP_IFS="lan3 lan4 eth2"
# Health may use any of these: WAN1 static or a DHCP lease.
HEALTH_IFS="eth1 lan3 lan4 eth2"
